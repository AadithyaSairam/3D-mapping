name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    defaults:
      run:
        working-directory: python-slam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # opencv-python links against libGL even when nothing is displayed, and
      # the runner image does not ship it. Without this, `import cv2` fails on
      # Linux before a single test runs.
      - name: Install OpenCV system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        # The suite is headless by design, it runs the whole tracker against
        # the synthetic camera, so it needs neither a webcam nor a display.
        run: python -m pytest tests/ -v
